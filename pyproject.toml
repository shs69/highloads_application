[project]
name = "highloads-applications"
version = "0.1.0"
description = "Asynchronous HTTP load balancer with Least Time and EWMA"
readme = "README.md"
authors = [
    { name = "kryukov-a-a", email = "kryukov" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.17.2",
]
plots = ["matplotlib>=3.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
