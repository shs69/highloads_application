[project]
name = "highloads-applications"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kryukov-a-a", email = "kryukov" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
]

[project.scripts]
highloads-applications = "highloads_applications:main"
backend = "highloads_applications.backend.__main__:main"
balancer = "highloads_applications.balancer.__main__:main"
generator = "highloads_applications.loadgen.__main__:main"
compare-ewma = "highloads_applications.loadgen.compare_ewma:main"

[project.optional-dependencies]
plots = ["matplotlib>=3.10"]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
